name: Android CI Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Restore Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare Release APK
      run: |
        mkdir -p app/build/outputs/apk/debug/
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Polymath-FileSystem.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Polymath-FileSystem
        path: app/build/outputs/apk/debug/Polymath-FileSystem.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/Polymath-FileSystem.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
