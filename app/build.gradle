plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

def debugKeystore = file("${rootDir}/debug.keystore")
def base64Keystore = file("${rootDir}/debug.keystore.base64")
if (!debugKeystore.exists() && base64Keystore.exists()) {
    try {
        byte[] decoded = java.util.Base64.getMimeDecoder().decode(base64Keystore.text.trim())
        debugKeystore.withOutputStream { it.write(decoded) }
    } catch (Exception e) {
        // Fallback
    }
}

android {
    namespace 'com.polymath.fs'
    compileSdk 34

    defaultConfig {
        applicationId "com.polymath.fs"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            def keystoreFile = file("${rootDir}/debug.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'

    // Kotlin & Coroutines
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // Injection annotations
    implementation 'javax.inject:javax.inject:1'
    
    // Room
    implementation 'androidx.room:room-runtime:2.7.0'
    implementation 'androidx.room:room-ktx:2.7.0'
    ksp 'androidx.room:room-compiler:2.7.0'
    
    // Coil for image thumbnail loading
    implementation 'io.coil-kt:coil:2.7.0'
    
    // libsu
    implementation 'com.github.topjohnwu.libsu:core:5.3.0'
    implementation 'com.github.topjohnwu.libsu:io:5.3.0'
    
    // Lifecycle / Fragment KTX
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    
    // WorkManager for scheduled JavaScript tasks
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    

}
