<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Tech Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%),
                        var(--bg-color);
        }

        header {
            padding: 2rem;
            text-align: center;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            animation: slideDown 0.6s ease-out;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            flex: 1;
            animation: fadeIn 1s ease-out;
        }

        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2), 0 0 20px var(--accent-glow);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .glass-panel:hover::before {
            left: 200%;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        
        .panel-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
            margin-left: 1rem;
        }

        .data-value {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        
        .data-unit {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .btn {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        /* Metric progress bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 1rem;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            height: 150px;
            overflow-y: auto;
            color: #a78bfa;
            border: 1px solid var(--glass-border);
        }
        
        .log-entry {
            margin-bottom: 0.5rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 0.25rem;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>System Nexus</h1>
    </header>

    <div class="dashboard-container">
        
        <div class="glass-panel">
            <div class="panel-title">Storage Matrix</div>
            <div class="data-value">
                <span id="storage-val">0</span>
                <span class="data-unit">GB Used</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted);">
                <span>0 GB</span>
                <span id="storage-total">100 GB</span>
            </div>
            <div class="progress-container">
                <div id="storage-bar" class="progress-bar"></div>
            </div>
        </div>

        <div class="glass-panel">
            <div class="panel-title">File System State</div>
            <div class="data-value">
                <span id="file-count">0</span>
                <span class="data-unit">Indexed Nodes</span>
            </div>
            <button class="btn" onclick="requestSync()">Initiate Sync</button>
            <p id="sync-status" style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted);"></p>
        </div>

        <div class="glass-panel" style="grid-column: 1 / -1;">
            <div class="panel-title">Activity Feed</div>
            <div class="log-container" id="activity-log">
                <div class="log-entry">Nexus UI Initialized... Awaiting Telemetry.</div>
            </div>
        </div>

    </div>

    <script>
        // Native interface binding wrapper
        const NativeBridge = {
            requestSync: function() {
                if (window.AndroidInterface && window.AndroidInterface.requestSync) {
                    window.AndroidInterface.requestSync();
                } else {
                    addLog("Mock: Sync requested");
                    setTimeout(() => updateMetrics(Math.floor(Math.random() * 80) + 10, 100, Math.floor(Math.random() * 5000) + 1000), 1000);
                }
            }
        };

        function requestSync() {
            document.getElementById('sync-status').innerText = "Syncing with Polymath Engine...";
            document.getElementById('sync-status').style.color = "#60a5fa";
            NativeBridge.requestSync();
        }

        // Called by Android natively
        function updateMetrics(usedGb, totalGb, fileCount) {
            document.getElementById('storage-val').innerText = usedGb;
            document.getElementById('storage-total').innerText = totalGb + ' GB';
            
            const percentage = (usedGb / totalGb) * 100;
            document.getElementById('storage-bar').style.width = percentage + '%';
            
            // Animate file count
            animateValue("file-count", parseInt(document.getElementById('file-count').innerText), fileCount, 1000);
            
            document.getElementById('sync-status').innerText = "Sync Complete. System Optimal.";
            document.getElementById('sync-status').style.color = "#10b981";
            
            addLog(`Telemetry received: Storage ${usedGb}/${totalGb}GB, Files: ${fileCount}`);
        }

        function addLog(message) {
            const logContainer = document.getElementById('activity-log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = `[${timestamp}] ${message}`;
            logContainer.prepend(entry);
        }

        function animateValue(id, start, end, duration) {
            if (start === end) return;
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Simulate initial load if not inside WebView
        if (!window.AndroidInterface) {
            setTimeout(() => updateMetrics(42, 128, 8432), 800);
        }
    </script>
</body>
</html>
